-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}.dialog-body{padding:24px}.dialog-body p{margin-bottom:15px}.dialog-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}.dialog-body ul{padding-left:19px;font-size:13px;line-height:1.9}.storage-warning{background:#fff0de;padding:10px 25px;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.blank-rule{padding:15px;background:#f8f9f4;margin-top:15px;border-radius:6px;font-size:12px}.align-end{align-items:end}input[type=checkbox],input[type=radio]{accent-color:var(--green);width:15px;height:15px;flex:none}input[type=file]{max-width:100%}

<div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<script>
'use strict';
const KEY='paper-studio-prototype-v1';
const subjects={accounting:{name:'Accounting',code:'AC',topics:['Financial statements','Costing','Budgeting'],requirements:['Prepare and interpret financial statements using the course conventions.','Calculate contribution, break-even volume and explain cost behaviour.','Prepare a budget and interpret variances.'],symbol:'Aa'},ba:{name:'Business Analytics',code:'BA',topics:['Descriptive analytics','Probability','Linear regression'],requirements:['Summarise a dataset and interpret descriptive statistics.','Use probabilities to support a business decision.','Interpret a regression equation, predictions and limitations.'],symbol:'Σ'},qm:{name:'Quantitative Maths',code:'QM',topics:['Differentiation','Linear equations','Probability'],requirements:['Differentiate functions and interpret marginal change.','Solve simultaneous linear equations and verify the result.','Calculate probabilities and interpret independent events.'],symbol:'ƒ'}};
const roles={'scope':'Exam scope','teaching':'Teaching material','past':'Past paper','solution':'Official solutions','rubric':'Rubric'};
const scenarios={normal:'Normal flow',missing_scope:'Missing exam scope',no_past:'No past paper',conflict:'Outdated paper topic',unresolved:'Unresolved source conflict',parse_error:'Unreadable formula',gap:'Insufficient chapter evidence',timeout:'Over two minutes',generation_error:'Generation failure',pdf_error:'PDF export failure'};
const clone=o=>JSON.parse(JSON.stringify(o));
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function sampleFiles(subject){const a=[{id:id(),name:'Current syllabus.pdf',role:'scope',sample:true},{id:id(),name:'Lecture notes.pptx',role:'teaching',sample:true},{id:id(),name:'Seminar exercises.docx',role:'teaching',sample:true}];for(let i=0;i<(subject==='qm'?1:2);i++){const p={id:id(),name:'Past paper '+(i+1)+'.pdf',role:'past',sample:true};a.push(p,{id:id(),name:'Official solutions '+(i+1)+'.pdf',role:'solution',linked:p.id,sample:true});}return a;}
function makeCourse(subject,name,empty=false){let s=subjects[subject];return{id:id(),subject,name:name||s.name,files:empty?[]:sampleFiles(subject),analyzed:false,confirmed:false,dirty:false,version:0,history:[],config:null,profile:{topics:s.topics.map((name,i)=>({id:'t'+i,name,included:true,depth:i===1?'Multi-step analysis':'Apply and explain',requirements:s.requirements[i],basis:'Explicit in course material'})).concat([{id:'excluded',name:'Topic outside current scope',included:false,depth:'Recognise and describe',requirements:'Appears only in an older exam. Excluded from the current syllabus.',basis:'Excluded by current scope'}]),duration:120,total:100,types:['Calculation','Explanation','Case analysis'],sections:[{name:'Section A',count:2,marks:20,rule:'all',answer:2},{name:'Section B',count:2,marks:30,rule:'all',answer:2}]}};}
function initial(){const courses=Object.keys(subjects).map(s=>makeCourse(s));return{schema:1,courses,courseId:courses[0].id,view:'materials',scenario:'normal'};}
let storageOK=true,state;try{const saved=JSON.parse(localStorage.getItem(KEY));state=saved?.schema===1&&Array.isArray(saved.courses)&&saved.courses.length?saved:initial();}catch{state=initial();storageOK=false;}
let ui={tab:'scope',topic:'t0',paper:null,resultTab:'paper',job:null},timers=[],toastTimer;
const app=document.getElementById('app'),dialog=document.getElementById('dialog');
const course=()=>state.courses.find(c=>c.id===state.courseId)||state.courses[0];
const files=()=>course().files.filter(f=>!(state.scenario==='missing_scope'&&f.role==='scope')&&!(state.scenario==='no_past'&&['past','solution'].includes(f.role)));
const hasPast=()=>files().some(f=>f.role==='past');
const hasRequired=()=>files().some(f=>f.role==='scope')&&files().some(f=>f.role==='teaching');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;}}
function notify(text){document.getElementById('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500);}
function btn(text,action,extra='',style=''){return `<button type="button" class="btn ${style}" data-action="${action}" ${extra}>${text}</button>`;}
function pill(text,style=''){return `<span class="pill ${style}">${h(text)}</span>`;}
function note(title,text,style='warning',action=''){return `<div class="note ${style}" ${style==='error'?'role="alert"':''}><strong>${h(title)}</strong><p>${text}</p>${action}</div>`;}
function hero(eye,title,text,extra=''){return `<div class="hero"><div><div class="eyebrow">${eye}</div><h1>${title}</h1><p>${text}</p></div>${extra||'<div class="hero-glyph" aria-hidden="true">✳</div>'}</div>`;}
function selectedTopic(){return course().profile.topics.find(t=>t.id===ui.topic)||course().profile.topics[0];}
function field(label,control){return `<label class="field"><span>${label}</span>${control}</label>`;}
function options(values,current){return values.map(v=>`<option value="${h(v)}" ${v===current?'selected':''}>${h(v)}</option>`).join('');}
function profileErrors(){const p=course().profile,e=[];if(!p.topics.some(t=>t.included))e.push('Include at least one topic.');if(p.topics.some(t=>!t.name.trim()||!t.requirements.trim()))e.push('Every topic needs a name and knowledge requirements.');if(!Number.isInteger(p.duration)||p.duration<1)e.push('Enter a positive exam duration.');if(!Number.isInteger(p.total)||p.total<1)e.push('Enter a positive total mark.');let sum=0;p.sections.forEach(s=>{if(!Number.isInteger(s.count)||s.count<1||!Number.isInteger(s.marks)||s.marks<1)e.push(s.name+': question count and marks must be positive whole numbers.');if(s.rule==='choose'&&(!Number.isInteger(s.answer)||s.answer<1||s.answer>s.count))e.push(s.name+': number to answer must be between 1 and the question count.');sum+=(s.rule==='all'?s.count:s.answer)*s.marks;});if(sum!==p.total)e.push('Section marks total '+sum+'; the declared total is '+p.total+'.');if(!p.types.length)e.push('Choose at least one exam question type.');if(state.scenario==='unresolved')e.push('Resolve the conflicting scope statements before confirming.');if(!hasRequired())e.push('Teaching materials and explicit exam scope are required.');return e;}
function defaultConfig(){const p=course().profile;return{mode:'full',topics:p.topics.filter(t=>t.included).map(t=>t.id),difficulty:'Exam-standard',types:[...p.types],count:p.sections.reduce((a,s)=>a+s.count,0)};}
function config(){return course().config||(course().config=defaultConfig());}
function settingsSummary(){const c=course(),q=config(),template=c.profile.sections.reduce((a,s)=>a+s.count,0);return{count:q.count,sub:q.count*2,marks:q.mode==='full'?c.profile.total:q.count*10,duration:q.mode==='full'?c.profile.duration:q.count*15,custom:q.mode==='full'&&q.count!==template};}
function configErrors(){const c=course(),q=config(),e=[];if(!c.confirmed)e.push('Confirm the course profile before generating.');if(!q.topics.length)e.push('Select at least one topic.');if(q.topics.some(t=>!c.profile.topics.some(p=>p.id===t&&p.included)))e.push('A selected topic is outside the confirmed scope.');if(!q.types.length)e.push('Select at least one question type.');if(q.types.some(t=>!c.profile.types.includes(t)))e.push('Select only types from the confirmed exam template.');if(!Number.isInteger(q.count)||q.count<1||q.count>12)e.push('For this prototype, choose 1–12 main questions.');if(q.count<q.types.length)e.push('Add questions or reduce types so each selected type appears.');if(q.count<q.topics.length)e.push('Add questions or reduce topics so each selected chapter appears.');if(settingsSummary().marks<q.count)e.push('The total marks must allow at least one mark per question.');if(state.scenario==='gap'&&q.topics.includes('t2'))e.push('Evidence for '+c.profile.topics[2].name+' is still insufficient after the simulated supplementary-source check.');if(!hasRequired())e.push('Required materials are missing.');if(state.scenario==='parse_error')e.push('Replace the unreadable formula before generating.');return e;}
function render(){const c=course(),view=state.view;app.innerHTML=`<div class="demo"><span><strong>Prototype — sample data</strong> <span class="muted">/ Design review v0.1</span></span><div class="row"><label>Scenario <select id="scenario" aria-label="Prototype scenario">${Object.entries(scenarios).map(([k,v])=>`<option value="${k}" ${state.scenario===k?'selected':''}>${v}</option>`).join('')}</select></label><button class="textbtn" data-action="about">About this prototype</button></div></div>${!storageOK?'<div class="storage-warning" role="status">Browser storage is unavailable. Changes last for this page session only.</div>':''}<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">p</span>Paper Studio</div><button class="course-switch" data-action="courses"><span><small>Your course</small><strong>${h(c.name)}</strong></span><span>⌄</span></button><div><div class="navcaption">Course workspace</div><nav class="nav" aria-label="Course workspace">${[['materials','Materials'],['profile','Course profile'],['generate','Generate'],['papers','Papers']].map(([key,label],i)=>`<button data-action="nav" data-view="${key}" class="${view===key?'active':''}" ${view===key?'aria-current="page"':''} ${key==='profile'&&!c.analyzed||key==='generate'&&!c.confirmed?'disabled':''}><span class="num">0${i+1}</span>${label}${key==='papers'&&c.history.length?' <small>('+c.history.length+')</small>':''}</button>`).join('')}</nav></div><div class="side-note"><strong>Practice with purpose.</strong><p>Your course. Your exam style.<br>A fresh opportunity to learn.</p><div style="margin-top:17px">${pill(c.confirmed?'Course confirmed':c.analyzed?'Review needed':'Set up your course',c.confirmed?'':'neutral')}</div></div></aside><div><header class="topbar"><div class="crumb"><button class="textbtn" data-action="courses">My courses</button><span>/</span><b>${h(c.name)}</b></div><div class="row">${c.version?'<span class="small muted">Course v'+c.version+'</span>':''}<button class="avatar" data-action="account" aria-label="Demo account">YS</button></div></header><main class="main" id="main">${ui.job?jobView():view==='courses'?coursesView():view==='materials'?materialsView():view==='profile'?profileView():view==='generate'?generateView():papersView()}</main></div></div>`;save();renderMaterialChanges();}
function materialsView(){const f=files(),required=hasRequired();return hero('01 / Course materials','Great practice starts<br>with your course.','Bring your lectures, exam scope and past papers together. We’ll turn them into a course profile you can review.')+`<div class="grid"><section class="card"><div class="card-head row between"><div><h2>Your source materials</h2><p>${f.length} files · Organised for this course</p></div>${btn('Load sample set','load-samples','','quiet')}</div>${state.scenario==='missing_scope'?'<div class="pad">'+note('Exam scope required','Add a current syllabus or another explicit statement of what is examinable. Lecture slides alone do not establish scope.','error',btn('Restore sample scope','resolve'))+'</div>':''}${state.scenario==='parse_error'?'<div class="pad">'+note('Formula could not be read','Lecture notes.pptx · slide 12. A formula required by the selected scope is unreadable. Replace or supplement this page.','error',btn('Replace with readable sample','resolve'))+'</div>':''}${state.scenario==='no_past'?'<div class="pad">'+note('No past paper available','You can continue. Exam structure and difficulty will be estimated and need your confirmation.')+'</div>':''}<div class="dropzone" id="dropzone"><div class="upload-icon" aria-hidden="true">↥</div><h3>A little context goes a long way.</h3><p>Drop course files here, or choose them from your device.</p><label class="btn" for="file-input">Browse files <span aria-hidden="true">＋</span></label><input type="file" id="file-input" class="sr-only" multiple accept=".pdf,.ppt,.pptx,.doc,.docx"><p>PDF · PPT/PPTX · Word. No scanned or handwritten material.</p><p style="margin-top:6px">Prototype: filenames only; nothing is read or uploaded.</p></div><div class="files"><div class="file-row head"><span>Document</span><span>Material type</span><span class="status">Status</span><span></span></div>${f.map(file=>`<div class="file-row"><div class="filename"><span class="fileicon">${h(file.name.split('.').pop().slice(0,4).toUpperCase())}</span><span>${h(file.name)}</span></div><select aria-label="Material type for ${h(file.name)}" data-file-role="${file.id}">${Object.entries(roles).map(([k,v])=>`<option value="${k}" ${file.role===k?'selected':''}>${v}</option>`).join('')}</select><span class="status">${file.sample?'Sample':'Name only'}</span><button class="iconbtn" data-action="remove-file" data-id="${file.id}" aria-label="Remove ${h(file.name)}">×</button>${file.role==='solution'?`<label class="linked">Linked to <select data-file-link="${file.id}" aria-label="Paper linked to ${h(file.name)}"><option value="">Choose paper</option>${f.filter(p=>p.role==='past').map(p=>`<option value="${p.id}" ${file.linked===p.id?'selected':''}>${h(p.name)}</option>`).join('')}</select></label>`:''}</div>`).join('')}</div><div class="card-foot"><span class="small muted">${required?'✓ Teaching materials & exam scope present':'Teaching materials and exam scope required'}</span>${btn('Analyze course <span aria-hidden="true">→</span>','analyze',!required||state.scenario==='parse_error'?'disabled':'','primary')}</div></section><aside class="stack"><div class="card pad side-card"><div class="eyebrow">A foundation for better questions</div><h2>What to include</h2>${[['01','Teaching materials','Lecture slides, seminar notes and exercises.'],['02','Current exam scope','Your syllabus or a clear exam-scope statement.'],['03','Past papers, if available','Add official solutions and rubrics to help establish exam style.']].map(([n,t,d])=>`<div class="guide-row"><span class="step-label">${n}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}<div class="rule"></div><p class="small">You’ll review the course understanding before a paper is created.</p></div>${cUpdateNote()}<div class="note"><strong>Your materials stay here.</strong>In this prototype, only names and demo settings are saved in this browser. Real file processing comes later.</div></aside></div>`;}
function cUpdateNote(){return course().version&&!course().confirmed?note('Course update pending','Your previous topic edits are preserved. Analyze the updated materials and review the changes before generating.'):'';}
function profileView(){const c=course(),p=c.profile,t=selectedTopic(),errors=profileErrors();return hero('02 / Review & confirm','Make sure we understand<br>your exam.','A reusable course profile, with the scope, depth and structure under your control.')+`${c.version&&c.dirty?note('Review the updated course','Your manual edits have been retained. Confirming creates a new course version; existing papers stay unchanged.'):''}${state.scenario==='conflict'?note('Current scope takes precedence','An older paper includes “Topic outside current scope”. The current syllabus excludes it, so it stays outside this course profile.','warning',btn('Compare source evidence','conflict-evidence')):''}${state.scenario==='unresolved'?note('Scope statements disagree','Current syllabus p.3 includes the final topic; the current exam announcement p.1 excludes it. Clarification is needed before confirmation.','error',btn('Use clarified sample scope','resolve')):''}${!hasPast()?note('Structure and difficulty are estimates','No past paper was supplied. Review the proposed structure below; it has not been calibrated against your exam.'):''}<div class="grid"><section class="card"><div class="tabs" role="tablist" aria-label="Course profile sections"><button role="tab" aria-selected="${ui.tab==='scope'}" data-action="profile-tab" data-tab="scope" class="${ui.tab==='scope'?'active':''}">Exam scope</button><button role="tab" aria-selected="${ui.tab==='structure'}" data-action="profile-tab" data-tab="structure" class="${ui.tab==='structure'?'active':''}">Exam structure</button></div>${ui.tab==='scope'?`<div class="card-head row between"><div><h2>Topics & expected depth</h2><p>${p.topics.filter(t=>t.included).length} included · Select a topic to edit its details</p></div>${btn('＋ Topic','add-topic','','quiet')}</div>${p.topics.map(topic=>`<div class="topic-row ${topic.id===t.id?'selected':''}"><input type="checkbox" aria-label="Include ${h(topic.name)}" data-topic-include="${topic.id}" ${topic.included?'checked':''}><button class="topic-name" data-action="select-topic" data-id="${topic.id}"><strong>${h(topic.name)}</strong><span>${h(topic.depth)}</span></button>${pill(topic.included?'In scope':'Excluded',topic.included?'':'neutral')}</div>`).join('')}<div class="topic-detail"><div class="eyebrow">Selected topic</div><div class="fields">${field('Topic name',`<input data-topic-field="name" value="${h(t.name)}">`)}${field('Expected depth',`<select data-topic-field="depth">${options(['Recognise and describe','Apply and explain','Multi-step analysis','Evaluate and justify'],t.depth)}</select>`)}</div>${field('Required knowledge',`<textarea data-topic-field="requirements">${h(t.requirements)}</textarea>`)}<span class="small muted">Basis: ${h(t.basis)}</span>${t.id==='excluded'&&t.included?note('This conflicts with the sample syllabus','This topic is explicitly excluded in the sample current scope. Exclude it or supply revised exam-scope evidence.','error'):''}</div>`:structureView()}<div class="pad">${errors.length?'<div class="validation" role="alert">'+errors.map(e=>'<div>• '+h(e)+'</div>').join('')+'</div>':'<span class="small" style="color:var(--green)">✓ Scope and exam structure are ready to confirm.</span>'}</div><div class="card-foot">${btn('← Materials','nav','data-view="materials"','quiet')}${btn('Confirm course & continue →','confirm',errors.length||p.topics.some(t=>t.id==='excluded'&&t.included)?'disabled':'','primary')}</div></section><aside class="stack"><div class="card pad side-card"><div class="eyebrow">The evidence behind it</div><h2>${ui.tab==='scope'?h(t.name):'Exam structure'}</h2><p class="small" style="margin-top:9px">Illustrative source excerpts. Real evidence will link back to your uploaded pages.</p><button class="source" data-action="evidence" data-source="scope"><div><b>Current syllabus</b><span>Page 3 · Explicit exam scope</span></div>↗</button><button class="source" data-action="evidence" data-source="teaching"><div><b>Lecture notes</b><span>Slides 8–15 · Course content</span></div>↗</button>${hasPast()?'<button class="source" data-action="evidence" data-source="past"><div><b>Past paper 1</b><span>Sections A–B · Inferred structure</span></div>↗</button>':'<div class="note warning" style="margin-top:12px">No past-paper evidence. Suggested structure requires your confirmation.</div>'}<div class="rule"></div><p class="small">Source statements, inferred exam patterns and your edits remain distinguishable.</p></div>${state.scenario==='gap'?note('A topic needs more evidence','The final included topic has insufficient teaching material. You may confirm the profile, but practice including that topic will pause for more evidence.'):''}<div class="note"><strong>Confirm once. Reuse often.</strong>Your next paper starts from these settings. Adjustments for a single practice paper won’t overwrite them.</div></aside></div>`;}
function structureView(){const p=course().profile;return `<div class="pad"><div class="fields">${field('Duration (minutes)',`<input type="number" min="1" data-profile="duration" value="${p.duration}">`)}${field('Total marks to attempt',`<input type="number" min="1" data-profile="total" value="${p.total}">`)}</div>${p.sections.map((s,i)=>`<div class="section-card"><h3 style="margin-bottom:13px">${s.name}</h3><div class="section-grid">${field('Main questions',`<input type="number" min="1" data-section="${i}" data-key="count" value="${s.count}">`)}${field('Marks per question',`<input type="number" min="1" data-section="${i}" data-key="marks" value="${s.marks}">`)}${field('Answer rule',`<select data-section="${i}" data-key="rule"><option value="all" ${s.rule==='all'?'selected':''}>All compulsory</option><option value="choose" ${s.rule==='choose'?'selected':''}>Choose questions</option></select>`)}${s.rule==='choose'?field('Questions to answer',`<input type="number" min="1" max="${s.count}" data-section="${i}" data-key="answer" value="${s.answer}">`):''}</div></div>`).join('')}<div style="margin-top:22px"><h3 style="margin-bottom:12px">Allowed question types</h3><div class="chips">${['Calculation','Explanation','Case analysis'].map(type=>`<label class="chip"><input type="checkbox" data-profile-type="${type}" ${p.types.includes(type)?'checked':''}>${type}</label>`).join('')}</div></div><div class="blank-rule">${hasPast()?'Structure inferred from the uploaded sample papers.':'Suggested structure · not calibrated against past papers.'} All values are editable.</div></div>`;}
function generateView(){const c=course(),q=config(),s=settingsSummary(),errors=configErrors();return hero('03 / Create your practice','A fresh paper.<br>A clearer picture.','Choose the practice you need today. We’ll use your confirmed course profile as the starting point.')+`${!hasPast()?note('Difficulty is uncalibrated','Without a past paper, the difficulty labels describe estimated reasoning depth.'):''}<div class="grid"><section class="card pad"><div class="form-section"><h3>What would you like to practise?</h3><div class="choice-grid">${[['full','Full mock exam','The shape and rhythm of a complete exam.'],['chapter','Chapter practice','Focused practice on the topics you choose.']].map(([v,l,d])=>`<label class="choice"><input type="radio" name="mode" value="${v}" ${q.mode===v?'checked':''}><span><b>${l}</b><small>${d}</small></span></label>`).join('')}</div></div><div class="form-section"><div class="row between" style="margin-bottom:13px"><h3 style="margin:0">Chapters</h3><span class="small muted">${q.topics.length} selected</span></div><div class="chips">${c.profile.topics.filter(t=>t.included).map(t=>`<label class="chip"><input type="checkbox" data-config-topic="${t.id}" ${q.topics.includes(t.id)?'checked':''}>${h(t.name)}</label>`).join('')}</div></div><div class="form-section"><h3>Difficulty for the whole paper</h3><div class="difficulty">${[['Foundation','Direct applications of individual concepts.'],['Exam-standard','Exam-level reasoning and integration.'],['Challenge','More connections, within your scope.']].map(([v,d])=>`<label class="choice"><input type="radio" name="difficulty" value="${v}" ${q.difficulty===v?'checked':''}><span><b>${v}</b><small>${d}</small></span></label>`).join('')}</div></div><div class="form-section"><h3>Question types</h3><div class="chips">${c.profile.types.map(t=>`<label class="chip"><input type="checkbox" data-config-type="${t}" ${q.types.includes(t)?'checked':''}>${t}</label>`).join('')}</div></div><div class="form-section"><div class="fields align-end">${field('Main questions',`<input type="number" min="1" max="12" id="question-count" value="${q.count}">`)}<p class="small">${s.sub} subquestions in the sample layout.<br>Prototype range: 1–12 main questions.</p></div>${s.custom?'<div class="note warning" style="margin-top:16px">Custom count: this paper uses an all-compulsory layout, with the total marks redistributed. Your saved exam template stays unchanged.</div>':''}${q.mode==='chapter'?'<p class="small" style="margin-top:12px">Demo estimate: 10 marks and 15 minutes per main question.</p>':''}</div>${errors.length?'<div class="note error" role="alert">'+errors.map(e=>'<div>• '+h(e)+'</div>').join('')+(state.scenario==='gap'?btn('View evidence gap','gap-details'):'')+'</div>':''}</section><aside class="stack"><div class="card pad side-card"><div class="eyebrow">Your paper at a glance</div><h2>${q.mode==='full'?'Full mock exam':'Chapter practice'}</h2><div class="summary-number">${s.count}</div><p class="small">main questions · ${s.sub} subquestions</p><div class="rule"></div><div class="summary-row"><span>Difficulty</span><b>${q.difficulty}</b></div><div class="summary-row"><span>Total marks</span><b>${s.marks}</b></div><div class="summary-row"><span>Duration</span><b>${s.duration} minutes</b></div><div class="summary-row"><span>Course profile</span><b>Version ${c.version}</b></div><div class="summary-row"><span>Chapters</span><b>${q.topics.length} selected</b></div><div class="rule"></div>${btn('Generate paper <span aria-hidden="true">→</span>','generate',errors.length?'disabled':'','primary full')}<p class="small" style="margin-top:12px;text-align:center">One paper + one mark scheme</p></div><div class="note"><strong>Just for this practice.</strong>These choices won’t change your saved course profile.</div><p class="small">Sample questions demonstrate layout and controls. This prototype does not generate or calibrate academic content.</p></aside></div>`;}
function jobView(){const j=ui.job,analysis=j.kind==='analysis';if(j.error)return hero('Task needs attention',j.error==='pdf'?'Your PDF export needs<br>another attempt.':'Something interrupted<br>this practice run.','Your materials, course profile and selections have been kept.')+`<section class="card progress-box">${note(j.error==='pdf'?'PDF preparation failed':'Generation failed',j.error==='pdf'?'The sample questions are retained, but the full result is not marked complete. Retry to finish the simulated export.':'The sample generator stopped before completion. Retry with the same settings.','error')}<div class="row">${btn('Retry '+(j.error==='pdf'?'export':'generation'),'retry','','primary')}${btn('Back to settings','cancel-job')}</div></section>`;return hero(analysis?'01 / Understanding your course':'03 / Preparing your practice',analysis?'Connecting the dots.':'Putting your paper together.',analysis?'Organising scope, learning depth and exam structure for your review.':'Preparing the questions, their mark scheme and the final layout.')+`<section class="card progress-box"><div class="row between"><h2>${analysis?'Analyzing course':'Generating your paper'}</h2><span class="elapsed" id="elapsed">${j.timeout?'02:08':'00:00'}</span></div><p class="small" style="margin-top:8px">Simulated progress · not a performance measurement</p>${j.timeout?'<div style="margin-top:20px">'+note('Two-minute target exceeded','This simulated run is still working. You can wait or cancel; it counts as a missed performance target.')+'</div>':''}<div style="margin:20px 0">${(analysis?['Reading material structure','Mapping scope and learning depth','Preparing the editable course profile']:['Preparing the paper structure','Creating questions and the mark scheme','Preparing previews and PDFs']).map((text,i)=>`<div class="progress-stage ${i<j.stage?'done':i===j.stage?'current':''}"><span class="dot">${i<j.stage?'✓':i===j.stage?'':i+1}</span><span>${text}</span></div>`).join('')}</div><div class="rule"></div>${btn('Cancel','cancel-job','','quiet')}</section>`;}
function papersView(){const c=course(),r=c.history.find(r=>r.id===ui.paper);if(!r)return hero('04 / Your practice library','Every paper.<br>A new perspective.','Revisit a practice paper, check its mark scheme or create your next challenge.',btn('＋ New paper','nav','data-view="generate" '+(!c.confirmed?'disabled':''),'primary'))+`<section class="card">${c.history.length?c.history.slice().reverse().map(r=>`<button class="history-item" data-action="open-paper" data-id="${r.id}"><span><b>${h(r.title)}</b><small>${r.config.mode==='full'?'Full mock exam':'Chapter practice'} · ${r.config.difficulty} · ${r.summary.count} questions · ${r.summary.marks} marks</small><small>${h(r.date)} · Course v${r.version} · Sample output</small></span><span aria-hidden="true">↗</span></button>`).join(''):`<div class="empty"><div class="eyebrow">Your next step</div><h2>A little practice goes a long way.</h2><p>Your completed sample papers will be saved here.</p>${btn(c.confirmed?'Create your first paper':'Set up your course','nav','data-view="'+(c.confirmed?'generate':'materials')+'"','primary')}</div>`}</section>`;return hero('04 / Practice paper',h(r.title),`${r.config.mode==='full'?'Full mock exam':'Chapter practice'} · ${r.config.difficulty} · Course v${r.version}`,btn('← All papers','all-papers','','quiet'))+`<div class="grid"><section class="card"><div class="tabs" role="tablist" aria-label="Result document"><button role="tab" aria-selected="${ui.resultTab==='paper'}" data-action="result-tab" data-tab="paper" class="${ui.resultTab==='paper'?'active':''}">Question paper</button><button role="tab" aria-selected="${ui.resultTab==='scheme'}" data-action="result-tab" data-tab="scheme" class="${ui.resultTab==='scheme'?'active':''}">Mark scheme</button></div><div class="paper-toolbar row between"><span class="small muted">${ui.resultTab==='paper'?'Your answers stay separate.':'Illustrative scoring · not an official mark scheme.'}</span>${pill('Sample output','neutral')}</div><div class="paper-wrap"><article class="exam-paper"><div class="exam-label">PAPER STUDIO / PRACTICE MATERIAL</div><h2>${h(r.courseName)}</h2><p style="text-align:center">${ui.resultTab==='paper'?'Practice paper':'Mark scheme'}</p><div class="exam-meta"><span>${r.summary.duration} minutes</span><span>${r.summary.marks} marks to attempt</span></div><p><b>${ui.resultTab==='paper'?'Instructions':'Scoring guidance'}</b><br>${ui.resultTab==='paper'?h(r.instructions):'Suggested marks are illustrative. Equivalent correct methods and well-supported alternative arguments are acceptable.'}</p>${r.questions.map((q,i)=>`<section class="exam-question"><h3><span>Question ${i+1} <span style="font-size:10px;font-weight:normal">/ ${h(q.section)}</span></span><span>[${q.marks}]</span></h3>${ui.resultTab==='paper'?`<p>${q.prompt}</p>${q.table||''}<p style="margin-top:10px">(a) ${q.partA} <b>[${q.aMarks}]</b><br>(b) ${q.partB} <b>[${q.bMarks}]</b></p><div class="answer-lines" aria-hidden="true"></div>`:`<p><b>${h(q.topic)} · ${q.type}</b></p><div class="answer-block"><p>${q.answer}</p></div><p style="margin-top:10px">(a) ${q.scoreA} <b>[${q.aMarks}]</b><br>(b) ${q.scoreB} <b>[${q.bMarks}]</b></p><p style="margin-top:8px;font-size:11px">Source context: sample course profile v${r.version}. Suggested marks; no official allocation supplied.</p>`}</section>`).join('')}<div class="exam-footer">Prototype — sample data · Demonstration only · ${r.questions.length} main questions / ${r.questions.length*2} subquestions</div></article></div></section><aside class="stack"><div class="card pad side-card"><div class="eyebrow">Ready for practice</div><h2>Your two documents</h2><p class="small" style="margin:10px 0 20px">Preview them separately. PDF buttons demonstrate the planned export handoff.</p>${btn('↓ Download paper PDF','download','data-kind="paper"','primary full')}<div style="height:10px"></div>${btn('↓ Download mark scheme PDF','download','data-kind="scheme"','full')}<div class="rule"></div><div class="summary-row"><span>Main questions</span><b>${r.summary.count}</b></div><div class="summary-row"><span>Total marks</span><b>${r.summary.marks}</b></div><div class="summary-row"><span>Saved</span><b>${h(r.date)}</b></div>${btn('View paper details','paper-details','','quiet full')}</div>${btn('Generate another paper →','nav','data-view="generate" '+(!c.confirmed?'disabled':''),'full')}<div class="note"><strong>A snapshot of your course.</strong>This paper keeps the settings it was created with, even if you update your course later.</div></aside></div>`;}

function stopJob(){timers.forEach(t=>{clearTimeout(t);clearInterval(t);});timers=[];ui.job=null;}
function startJob(kind,retry=false){stopJob();if(kind==='generation'&&configErrors().length){render();return;}const timeout=state.scenario==='timeout';ui.job={kind,stage:0,timeout,started:Date.now()};render();const delay=timeout?6500:kind==='analysis'?1500:2700;timers.push(setTimeout(()=>{if(ui.job){ui.job.stage=1;render();}},delay/3),setTimeout(()=>{if(ui.job){ui.job.stage=2;render();}},delay*2/3));timers.push(setInterval(()=>{const el=document.getElementById('elapsed');if(el&&ui.job){const sec=Math.floor((Date.now()-ui.job.started)/1000)+(timeout?128:0);el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}},500));timers.push(setTimeout(()=>{if(kind==='analysis'){stopJob();course().analyzed=true;course().confirmed=false;state.view='profile';ui.tab='scope';render();notify('Sample course analysis is ready to review.');return;}if(!retry&&['pdf_error','generation_error'].includes(state.scenario)){const error=state.scenario==='pdf_error'?'pdf':'generation';const pending=error==='pdf'?makePaper():null;stopJob();ui.job={kind,error,pending};render();return;}completePaper();},delay));}
function makeQuestion(topic,type,index,marks,section){const c=course(),n=c.history.length+index+1,aMarks=Math.max(1,Math.round(marks*.6)),bMarks=marks-aMarks;let q={topic:topic.name,type,marks,aMarks,bMarks,section,prompt:'',partA:'',partB:'',answer:'',scoreA:'Award credit for a correct method and result.',scoreB:'Award credit for a justified interpretation.'};if(type==='Calculation'){if(c.subject==='accounting'){if(topic.id==='t0'){const sales=42000+n*1000,cost=18000,expense=9000;q.prompt='A small business reports the following figures for the period.';q.table=`<table><tr><th>Item</th><th>Amount ($)</th></tr><tr><td>Revenue</td><td>${sales}</td></tr><tr><td>Cost of sales</td><td>${cost}</td></tr><tr><td>Operating expenses</td><td>${expense}</td></tr></table>`;q.partA='Calculate gross profit and operating profit.';q.partB='Explain why operating profit differs from gross profit.';q.answer=`Gross profit = ${sales} − ${cost} = $${sales-cost}. Operating profit = ${sales-cost} − ${expense} = $${sales-cost-expense}. Operating expenses are deducted after cost of sales.`;}else if(topic.id==='t1'){let fixed=12000+n*600;q.prompt=`A product sells for $50 per unit. Variable cost is $30 per unit and fixed costs are $${fixed}.`;q.partA='Calculate contribution per unit and break-even sales volume.';q.partB='Explain how a higher variable cost affects break-even volume, all else equal.';q.answer=`Contribution = $50 − $30 = $20. Break-even volume = ${fixed} / 20 = ${fixed/20} units. A higher variable cost lowers contribution, increasing the number of units needed to cover fixed costs.`;}else{const units=100+n*10;q.prompt=`Budgeted output is ${units} units at a variable cost of $20 per unit. Actual output equals budget and actual variable spending is $${units*22}.`;q.partA='Calculate budgeted variable cost and the spending variance.';q.partB='Interpret the variance, stating one possible explanation.';q.answer=`Budgeted cost = ${units} × $20 = $${units*20}. Actual minus budget = $${units*2}, an adverse variance. One possible explanation is an increase in input prices; investigate before concluding that efficiency fell.`;}}else if(c.subject==='ba'){if(topic.id==='t0'){let values=[10+n,12+n,14+n,16+n,18+n];q.prompt='Daily orders over five days are '+values.join(', ')+'.';q.partA='Calculate the mean and median daily orders.';q.partB='Explain how one unusually high day could affect the mean and median.';q.answer=`The sum is ${values.reduce((a,b)=>a+b,0)}, so the mean is ${14+n}. The median (third ordered value) is ${14+n}. An extreme high value affects the mean more strongly than the median.`;}else if(topic.id==='t1'){q.prompt='A campaign reaches two independent customer groups. The probability of conversion is 0.20 for one selected person from group A and 0.30 for one from group B.';q.partA='Calculate the probability that both selected people convert.';q.partB='Explain the independence assumption used.';q.answer='P(both) = 0.20 × 0.30 = 0.06. Independence means one person’s conversion does not change the conversion probability of the other; shared influences could invalidate this assumption.';}else{let x=4+n;q.prompt='A fitted model predicts weekly sales y from advertising spend x: y = 120 + 8x. Both quantities use the units defined in this course example.';q.partA=`Predict y when x = ${x}.`;q.partB='Interpret the slope and state a limitation of the prediction.';q.answer=`Predicted y = 120 + 8 × ${x} = ${120+8*x}. An extra unit of x is associated with 8 additional units of y. This is not evidence of causation, and extrapolation or model error may make the prediction unreliable.`;}}else{if(topic.id==='t0'){const a=2+n;q.prompt=`Let f(x) = ${a}x² + 3x + 5.`;q.partA='Find f′(x) and evaluate it at x = 2.';q.partB='Interpret the derivative at that point.';q.answer=`f′(x) = ${2*a}x + 3. At x = 2, f′(2) = ${4*a+3}. This is the instantaneous rate of change of f with respect to x at x = 2.`;}else if(topic.id==='t1'){let x=2+n,y=3;q.prompt=`Consider x + y = ${x+y} and 2x − y = ${2*x-y}.`;q.partA='Solve for x and y.';q.partB='Verify the result by substitution into both equations.';q.answer=`Adding the equations gives 3x = ${3*x}; x = ${x}. Then y = ${x+y} − ${x} = ${y}. Verification: ${x} + ${y} = ${x+y}; 2(${x}) − ${y} = ${2*x-y}.`;}else{q.prompt='Events A and B are independent, with P(A) = 0.4 and P(B) = 0.5.';q.partA='Calculate P(A ∩ B) and P(A ∪ B).';q.partB='Explain why you subtract the intersection when calculating the union.';q.answer='P(A ∩ B) = 0.4 × 0.5 = 0.2. P(A ∪ B) = 0.4 + 0.5 − 0.2 = 0.7. Adding the two individual probabilities counts their intersection twice, so it must be subtracted once.';}}}else{q.prompt=`Consider the topic of <b>${h(topic.name)}</b> in the sample course. ${type==='Case analysis'?'A decision-maker proposes applying the course method to a new situation without checking its assumptions.':'A learner can reproduce a method but has not explained why it applies.'}`;q.partA=type==='Case analysis'?'Evaluate the proposed approach, identifying relevant assumptions.':'Explain the central method and when it is appropriate.';q.partB=type==='Case analysis'?'Give a justified recommendation and one limitation.':'Describe one limitation or common misuse, with a reason.';const concept=topic.requirements;q.answer=`A suitable response should address the course requirement: “${h(concept)}” It should first establish the relevant inputs and assumptions, then explain how the method connects those inputs to the conclusion. ${type==='Case analysis'?'The recommendation is to check those assumptions and the quality of the evidence before applying the method, and to state how uncertainty affects the decision.':'The method is appropriate only when its assumptions hold; applying it mechanically can produce a misleading interpretation.'} Alternative well-reasoned responses are acceptable. This generic sample illustrates the intended answer layout; it is not a gold-standard academic answer.`;q.scoreA='Relevant concepts, reasoning and explicit assumptions.';q.scoreB='A justified interpretation or recommendation, with a limitation.';}return q;}
function makePaper(){const c=course(),q=clone(config()),s=clone(settingsSummary()),topics=c.profile.topics.filter(t=>q.topics.includes(t.id));let layout=[],instructions='Answer all questions. Show your working and state any assumptions.';if(q.mode==='full'&&!s.custom){c.profile.sections.forEach(sec=>{for(let i=0;i<sec.count;i++)layout.push({marks:sec.marks,section:sec.name});});instructions=c.profile.sections.map(sec=>sec.name+': '+(sec.rule==='all'?'answer all '+sec.count+' questions':'answer '+sec.answer+' of '+sec.count+' questions')+'.').join(' ')+' Show your working.';}else for(let i=0;i<q.count;i++)layout.push({marks:Math.floor(s.marks/q.count)+(i<s.marks%q.count?1:0),section:'Practice'});return{id:id(),title:'Practice paper '+String(c.history.length+1).padStart(2,'0'),courseName:c.name,version:c.version,profile:clone(c.profile),config:q,summary:s,date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),instructions,questions:layout.map((l,i)=>makeQuestion(topics[i%topics.length],q.types[i%q.types.length],i,l.marks,l.section)),calibrated:hasPast(),sample:true};}
function completePaper(existing){const r=existing||makePaper();stopJob();course().history.push(r);ui.paper=r.id;ui.resultTab='paper';state.view='papers';render();notify('Sample paper saved to this course. Real PDF export is not connected.');}
function addFiles(list){const allowed=/\.(pdf|pptx?|docx?)$/i;let added=0,rejected=0;for(const f of list){if(!allowed.test(f.name)){rejected++;continue;}const name=f.name,role=/syllabus|scope/i.test(name)?'scope':/solution|answer|scheme/i.test(name)?'solution':/past|mock|exam/i.test(name)?'past':/rubric/i.test(name)?'rubric':'teaching';course().files.push({id:id(),name,role,sample:false});added++;}if(added)dirty(true);render();notify(added+' filename(s) added. '+(rejected?rejected+' unsupported file(s) skipped. ':'')+'No file contents were read.');}

document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,c=course();if(a==='close-dialog'){dialog.close();return;}if(a==='about'){openDialog('A prototype for the conversation',`<p>This local prototype demonstrates the agreed student journey.</p><ul><li>All course content, citations and questions are illustrative.</li><li>Files are represented by name only. Nothing is uploaded.</li><li>AI analysis, web supplementation, authentication and PDF export are not connected.</li><li>Progress is simulated, not a timing benchmark.</li><li>Changes are stored in this browser when available.</li></ul><p>Use the Scenario menu to review recovery paths. It is a prototype control, not a planned student feature.</p>`,btn('Reset demo data','reset','','danger')+btn('Continue reviewing','close-dialog','','primary'));return;}if(a==='account'){openDialog('Demo account',`<p>You are viewing a local demonstration workspace. This is not an authenticated account.</p><p>The product will provide independent accounts and course spaces for invited users. This prototype stores all sample courses in the same browser.</p>`);return;}if(a==='reset'){dialog.close();stopJob();state=initial();ui={tab:'scope',topic:'t0',paper:null,resultTab:'paper',job:null};render();notify('Demo data reset.');return;}if(a==='nav'){navigate(b.dataset.view);return;}if(a==='courses'){navigate('courses');return;}if(a==='open-course'){state.courseId=b.dataset.id;ui.paper=null;ui.topic='t0';state.scenario='normal';state.view=course().confirmed?'generate':'materials';render();return;}if(a==='new-course'){openDialog('Create a course',`<div class="stack">${field('Course name','<input id="new-name" maxlength="80" placeholder="e.g. Introduction to accounting">')}${field('Sample subject for the prototype','<select id="new-subject">'+Object.entries(subjects).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')+'</select>')}<p class="small">The subject selects example content only. The product will use the materials you supply.</p></div>`,btn('Cancel','close-dialog')+btn('Create course','create-course','','primary'));return;}if(a==='create-course'){const name=document.getElementById('new-name').value.trim();if(!name){document.getElementById('new-name').focus();notify('Enter a course name.');return;}const n=makeCourse(document.getElementById('new-subject').value,name,true);state.courses.push(n);state.courseId=n.id;state.view='materials';state.scenario='normal';ui.topic='t0';dialog.close();render();return;}if(a==='delete-course'){openDialog('Delete this demo course?',`<p>Remove ${h(state.courses.find(c=>c.id===b.dataset.id).name)} and its sample papers from this browser?</p>`,btn('Keep course','close-dialog')+btn('Delete course','confirm-delete','data-id="'+b.dataset.id+'"','danger'));return;}if(a==='confirm-delete'){state.courses=state.courses.filter(c=>c.id!==b.dataset.id);if(!state.courses.length)state.courses.push(makeCourse('accounting'));if(state.courseId===b.dataset.id)state.courseId=state.courses[0].id;state.view='courses';dialog.close();render();return;}if(a==='load-samples'){const existing=new Set(c.files.map(f=>f.name));const sample=sampleFiles(c.subject);const newFiles=sample.filter(f=>!existing.has(f.name));for(const f of newFiles){if(f.role==='solution'){const paired=sample.find(p=>p.id===f.linked);f.linked=c.files.find(p=>p.name===paired?.name)?.id||f.linked;}c.files.push(f);}dirty(true);render();notify('Sample materials added; existing topic edits are preserved.');return;}if(a==='remove-file'){c.files=c.files.filter(f=>f.id!==b.dataset.id);c.files.forEach(f=>{if(f.linked===b.dataset.id)f.linked='';});dirty(true);render();return;}if(a==='analyze'){if(hasRequired()&&state.scenario!=='parse_error')startJob('analysis');return;}if(a==='resolve'){const old=state.scenario;state.scenario='normal';if(['missing_scope','parse_error','unresolved'].includes(old))dirty(old!=='unresolved');render();notify('The sample evidence has been clarified. Review it before continuing.');return;}if(a==='profile-tab'){ui.tab=b.dataset.tab;render();return;}if(a==='select-topic'){ui.topic=b.dataset.id;render();return;}if(a==='add-topic'){const t={id:id(),name:'New topic',included:true,depth:'Apply and explain',requirements:'Describe the required knowledge and add supporting course evidence.',basis:'User added · evidence to review'};c.profile.topics.push(t);ui.topic=t.id;dirty();render();return;}if(a==='confirm'){if(profileErrors().length||c.profile.topics.some(t=>t.id==='excluded'&&t.included))return;c.confirmed=true;c.dirty=false;c.materialChanges=[];c.version++;if(!c.config)c.config=defaultConfig();else{c.config.topics=c.config.topics.filter(id=>c.profile.topics.some(t=>t.id===id&&t.included));c.config.types=c.config.types.filter(t=>c.profile.types.includes(t));}state.view='generate';render();notify('Course profile confirmed. Your practice settings are ready.');return;}if(a==='evidence'){const source=b.dataset.source,t=selectedTopic();openDialog('Sample evidence · '+(source==='scope'?'Current syllabus':source==='past'?'Past paper 1':'Lecture notes'),`<div class="note warning">Illustrative citation. No uploaded document was read.</div><p><b>${source==='scope'?'Page 3':source==='past'?'Sections A–B':'Slides 8–15'}</b></p><p>${source==='scope'?'The current sample scope includes the first three topics and excludes the older-paper topic.':source==='past'?'Two sections, four compulsory questions, 100 marks and 120 minutes. These values are inferred from the sample papers.':h(t.requirements)}</p><p class="small">In the product, this panel will show the actual source excerpt and its location.</p>`);return;}if(a==='conflict-evidence'){openDialog('Which scope applies?',`<p><b>Current syllabus · page 3</b><br>Excludes the older-paper topic.</p><p><b>Older past paper · question 4</b><br>Contains a question on that topic.</p><div class="note">The current explicit scope determines what is examinable. The old question may inform style, but cannot expand the scope.</div><p class="small">Both excerpts are illustrative.</p>`);return;}if(a==='gap-details'){openDialog('More evidence is needed',`<p><b>${h(c.profile.topics[2].name)}</b> is included in the sample scope, but the available teaching notes do not explain the required method.</p><div class="note warning"><strong>Simulated supplementary-source check</strong>Reason: missing teaching detail. Source: illustrative external course note (not retrieved). Outcome: does not establish this course’s required conventions. No unsupported addition was accepted.</div><p>Supply teaching evidence or remove this chapter from the current practice selection.</p>`,btn('Add materials','gap-materials')+btn('Exclude this chapter','exclude-gap','','primary'));return;}if(a==='gap-materials'){dialog.close();state.view='materials';render();return;}if(a==='exclude-gap'){config().topics=config().topics.filter(t=>t!=='t2');dialog.close();render();return;}if(a==='generate'){if(!configErrors().length)startJob('generation');return;}if(a==='cancel-job'){const analysis=ui.job?.kind==='analysis';stopJob();state.view=analysis?'materials':'generate';render();notify('Demo task cancelled. Your settings were kept.');return;}if(a==='retry'){const pending=ui.job?.pending;if(pending){stopJob();ui.job={kind:'generation',stage:2,started:Date.now()};render();timers.push(setTimeout(()=>completePaper(pending),900));}else startJob('generation',true);return;}if(a==='open-paper'){ui.paper=b.dataset.id;ui.resultTab='paper';render();return;}if(a==='all-papers'){ui.paper=null;render();return;}if(a==='result-tab'){ui.resultTab=b.dataset.tab;render();return;}if(a==='download'){const r=c.history.find(r=>r.id===ui.paper),kind=b.dataset.kind;openDialog(kind==='paper'?'Question paper PDF':'Mark scheme PDF',`<div class="note warning"><strong>Export handoff preview</strong>Real PDF export is not connected in this prototype.</div><p>The product will download a separate ${kind==='paper'?'question paper without answers':'mark scheme with worked answers and suggested scoring'}.</p><p class="small">Planned filename:<br><b>${h(r.title.toLowerCase().replaceAll(' ','-'))}-${kind==='paper'?'questions':'mark-scheme'}.pdf</b></p><p>Production completion requires both PDFs and the full web preview to be ready.</p>`);return;}if(a==='paper-details'){const r=c.history.find(r=>r.id===ui.paper);openDialog('This paper’s saved settings',`<p><b>${h(r.courseName)} · Course v${r.version}</b><br>${h(r.date)}</p><ul><li>${r.config.mode==='full'?'Full mock exam':'Chapter practice'} · ${r.config.difficulty}</li><li>${r.summary.count} main questions / ${r.summary.sub} subquestions</li><li>${r.summary.marks} marks to attempt / ${r.summary.duration} minutes</li><li>Chapters: ${r.profile.topics.filter(t=>r.config.topics.includes(t.id)).map(t=>h(t.name)).join(', ')}</li><li>Types: ${r.config.types.join(', ')}</li><li>${r.calibrated?'Sample past-paper structure':'No past paper; estimated structure and difficulty'}</li></ul><p class="small">This is a preserved snapshot, not your current editable course profile. All content is illustrative.</p>`);return;}});
document.addEventListener('change',event=>{const e=event.target,c=course();if(e.dataset.liveEdit==='true'){delete e.dataset.liveEdit;save();return;}if(e.id==='file-input'){addFiles(e.files);return;}if(e.id==='scenario'){if(ui.job)stopJob();state.scenario=e.value;if(!['normal','timeout','pdf_error','generation_error','gap'].includes(e.value)){c.confirmed=false;if(['missing_scope','no_past','parse_error'].includes(e.value)){c.analyzed=false;state.view='materials';}else{c.analyzed=true;state.view='profile';}}if(e.value==='gap'&&c.confirmed)state.view='generate';if(['timeout','pdf_error','generation_error'].includes(e.value)&&c.confirmed)state.view='generate';render();return;}if(e.dataset.fileRole){const f=c.files.find(f=>f.id===e.dataset.fileRole);f.role=e.value;dirty(true);render();return;}if(e.dataset.fileLink){c.files.find(f=>f.id===e.dataset.fileLink).linked=e.value;dirty(true);render();return;}if(e.dataset.topicInclude){c.profile.topics.find(t=>t.id===e.dataset.topicInclude).included=e.checked;dirty();render();return;}if(e.dataset.topicField){const t=selectedTopic();t[e.dataset.topicField]=e.value;t.basis='User edited · evidence not revalidated';dirty();render();return;}if(e.dataset.profile){c.profile[e.dataset.profile]=Number(e.value);dirty();render();return;}if(e.dataset.section!==undefined){const s=c.profile.sections[Number(e.dataset.section)];s[e.dataset.key]=e.dataset.key==='rule'?e.value:Number(e.value);dirty();render();return;}if(e.dataset.profileType){c.profile.types=e.checked?[...new Set([...c.profile.types,e.dataset.profileType])]:c.profile.types.filter(t=>t!==e.dataset.profileType);dirty();render();return;}if(e.name==='mode'){config().mode=e.value;render();return;}if(e.name==='difficulty'){config().difficulty=e.value;render();return;}if(e.dataset.configTopic){config().topics=e.checked?[...new Set([...config().topics,e.dataset.configTopic])]:config().topics.filter(t=>t!==e.dataset.configTopic);render();return;}if(e.dataset.configType){config().types=e.checked?[...new Set([...config().types,e.dataset.configType])]:config().types.filter(t=>t!==e.dataset.configType);render();return;}if(e.id==='question-count'){config().count=Number(e.value);render();}});
// Update editable fields before blur, so rerendering cannot swallow the next button click.
document.addEventListener('input',event=>{
 const e=event.target;if(!['INPUT','TEXTAREA'].includes(e.tagName))return;
 const raw=e.value,start=e.selectionStart,end=e.selectionEnd,c=course();let selector;
 if(e.dataset.topicField){selectedTopic()[e.dataset.topicField]=raw;selectedTopic().basis='User edited · evidence not revalidated';dirty();selector=e.tagName.toLowerCase()+'[data-topic-field="'+e.dataset.topicField+'"]';}
 else if(e.dataset.profile){c.profile[e.dataset.profile]=Number(raw);dirty();selector='[data-profile="'+e.dataset.profile+'"]';}
 else if(e.dataset.section!==undefined){c.profile.sections[Number(e.dataset.section)][e.dataset.key]=Number(raw);dirty();selector='[data-section="'+e.dataset.section+'"][data-key="'+e.dataset.key+'"]';}
 else if(e.id==='question-count'){config().count=Number(raw);selector='#question-count';}
 else return;
 render();const replacement=document.querySelector(selector);if(replacement){replacement.value=raw;replacement.dataset.liveEdit='true';replacement.focus({preventScroll:true});if(start!==null&&end!==null)replacement.setSelectionRange(start,end);}
});
document.addEventListener('dragover',e=>{if(e.target.closest('#dropzone')){e.preventDefault();document.getElementById('dropzone').classList.add('drag');}});
document.addEventListener('dragleave',e=>{e.target.closest('#dropzone')?.classList.remove('drag');});
document.addEventListener('drop',e=>{if(e.target.closest('#dropzone')){e.preventDefault();addFiles(e.dataTransfer.files);}});
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});
if(!['courses','materials','profile','generate','papers'].includes(state.view))state.view='materials';
if(state.view==='generate'&&!course().confirmed)state.view='materials';
render();
