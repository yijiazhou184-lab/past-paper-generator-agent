components:
  schemas:
    AnalyseRequest:
      type: object
      properties:
        context_hash:
          type: string
          maxLength: 64
        authorize_upload:
          type: boolean
          default: false
        parent_id:
          type: string
          format: uuid
          nullable: true
      required:
      - context_hash
    AnswerRequest:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 1
        question_id:
          type: string
          maxLength: 120
        text:
          type: string
          maxLength: 3000
      required:
      - expected_revision
      - question_id
      - text
    ConfigResponse:
      type: object
      properties:
        draft: {}
        committed_revision:
          type: integer
      required:
      - committed_revision
      - draft
    ConfirmRequest:
      type: object
      properties:
        draft_id:
          type: string
          format: uuid
        expected_revision:
          type: integer
          minimum: 1
      required:
      - draft_id
      - expected_revision
    CourseSchema:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        code:
          type: string
        scope_statement:
          type: string
        scope_provenance:
          type: string
      required:
      - code
      - id
      - scope_provenance
      - scope_statement
      - title
    CoursesSchema:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CourseSchema'
      required:
      - courses
    DraftResponse:
      type: object
      properties:
        draft: {}
        committed_revision:
          type: integer
      required:
      - committed_revision
      - draft
    FreezeRequest:
      type: object
      properties:
        confirmation_id:
          type: string
          format: uuid
        config_revision:
          type: integer
          minimum: 1
        config_hash:
          type: string
          maxLength: 64
          minLength: 64
      required:
      - config_hash
      - config_revision
      - confirmation_id
    GenerateRequest:
      type: object
      properties:
        confirmation_id:
          type: string
          format: uuid
        config_revision:
          type: integer
          minimum: 1
        config_hash:
          type: string
          maxLength: 64
          minLength: 64
        context_hash:
          type: string
          maxLength: 64
          minLength: 64
        authorize_upload:
          type: boolean
          default: false
      required:
      - config_hash
      - config_revision
      - confirmation_id
      - context_hash
    GenerationAnswerSchema:
      type: object
      properties:
        candidate_id:
          type: string
          format: uuid
        answers:
          type: array
          items: {}
        report:
          nullable: true
        assets:
          type: array
          items: {}
        model_outputs:
          type: array
          items: {}
        reference_sources:
          type: array
          items: {}
